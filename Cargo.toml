[workspace]
resolver = "3"
members = [
    "crates/agentforge-core",
    "crates/agentforge-host",
    "crates/agentforge-cli",
    "crates/agentforge-demo",
    "crates/agentforge-physics",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sumerchoudhary78/aigameengine"
publish = false

[workspace.dependencies]
agentforge-core = { path = "crates/agentforge-core" }
agentforge-host = { path = "crates/agentforge-host" }
agentforge-demo = { path = "crates/agentforge-demo" }
agentforge-physics = { path = "crates/agentforge-physics" }

clap = { version = "4.6.7", features = ["derive"] }
rapier2d-f64 = { version = "0.36.1", features = ["enhanced-determinism"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
